<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Excel Grid</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>

<canvas id="gridCanvas"></canvas>

<script>
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');

    const ROW_NUM_WIDTH = 45;
    const COL_NUM_HEIGHT = 25;

    let matrix = [];
    let widths = [];
    let heights = [];
    let merges = [];
    let mergeLookup = {};

    let maxRows = 0;
    let maxCols = 0;

    let scrollX = 0;
    let scrollY = 0;
    let zoom = 1.0;

    let touchStartX = 0;
    let touchStartY = 0;
    let lastScrollX = 0;
    let lastScrollY = 0;
    let initialPinchDistance = null;
    let initialZoom = 1.0;

    function init() {
        updateCanvasSize();
        window.addEventListener('resize', () => {
            updateCanvasSize();
            draw();
        });
        setupTouchEvents();
        
        // Автоматический запуск, если Bridge доступен
        if (window.AndroidBridge && typeof window.AndroidBridge.getExcelData === 'function') {
            loadData();
        }
    }

    function onDataReady() {
        loadData();
    }

    function loadData() {
        try {
            if (!window.AndroidBridge) return;
            const rawJson = window.AndroidBridge.getExcelData();
            if (!rawJson) return;

            const parsed = JSON.parse(rawJson);
            matrix = parsed.matrix || [];
            widths = parsed.widths || [];
            heights = parsed.heights || [];
            merges = parsed.merges || [];

            maxRows = matrix.length;
            maxCols = 0;
            for (let r = 0; r < maxRows; r++) {
                if (matrix[r] && matrix[r].length > maxCols) {
                    maxCols = matrix[r].length;
                }
            }

            buildMergeLookup();
            draw();
        } catch (e) {
            console.error("Data parse error: ", e);
        }
    }

    function buildMergeLookup() {
        mergeLookup = {};
        for (let i = 0; i < merges.length; i++) {
            let m = merges[i];
            mergeLookup[`${m.sr}_${m.sc}`] = { isMain: true, m: m };
            for (let r = m.sr; r <= m.er; r++) {
                for (let c = m.sc; c <= m.ec; c++) {
                    if (r !== m.sr || c !== m.sc) {
                        mergeLookup[`${r}_${c}`] = { isChild: true, mainR: m.sr, mainC: m.sc };
                    }
                }
            }
        }
    }

    function updateCanvasSize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        ctx.scale(dpr, dpr);
    }

    function getColName(colIndex) {
        let name = "";
        let num = colIndex;
        while (num >= 0) {
            name = String.fromCharCode((num % 26) + 65) + name;
            num = Math.floor(num / 26) - 1;
        }
        return name;
    }

    function getCellRect(r, c) {
        let x = 0;
        for (let i = 0; i < c; i++) {
            x += (widths[i] || 80);
        }
        let y = 0;
        for (let i = 0; i < r; i++) {
            y += (heights[i] || 25);
        }
        let w = widths[c] || 80;
        let h = heights[r] || 25;
        return { x: x, y: y, w: w, h: h };
    }

    function draw() {
        let clientW = window.innerWidth;
        let clientH = window.innerHeight;

        ctx.clearRect(0, 0, clientW, clientH);
        if (maxRows === 0) return;

        ctx.save();
        ctx.textBaseline = 'middle';

        // ВИРТУАЛИЗАЦИЯ: Определение видимых диапазонов для отсечения лишнего рендера
        let visibleStartCol = 0, visibleEndCol = maxCols - 1;
        let visibleStartRow = 0, visibleEndRow = maxRows - 1;

        let currentX = 0;
        for (let c = 0; c < maxCols; c++) {
            let w = (widths[c] || 80) * zoom;
            let screenX = ROW_NUM_WIDTH + (currentX - scrollX) * zoom;
            if (screenX + w < ROW_NUM_WIDTH) visibleStartCol = c;
            if (screenX > clientW && visibleEndCol === maxCols - 1) { visibleEndCol = c; break; }
            currentX += (widths[c] || 80);
        }

        let currentY = 0;
        for (let r = 0; r < maxRows; r++) {
            let h = (heights[r] || 25) * zoom;
            let screenY = COL_NUM_HEIGHT + (currentY - scrollY) * zoom;
            if (screenY + h < COL_NUM_HEIGHT) visibleStartRow = r;
            if (screenY > clientH && visibleEndRow === maxRows - 1) { visibleEndRow = r; break; }
            currentY += (heights[r] || 25);
        }

        // 1. Отрисовка основной сетки ячеек
        for (let r = visibleStartRow; r <= visibleEndRow; r++) {
            for (let c = visibleStartCol; c <= visibleEndCol; c++) {
                let lookup = mergeLookup[`${r}_${c}`];
                if (lookup && lookup.isChild) continue;

                let rect = getCellRect(r, c);
                let cx = ROW_NUM_WIDTH + (rect.x - scrollX) * zoom;
                let cy = COL_NUM_HEIGHT + (rect.y - scrollY) * zoom;
                let cw = rect.w * zoom;
                let ch = rect.h * zoom;

                if (lookup && lookup.isMain) {
                    let fullW = 0, fullH = 0;
                    for (let i = lookup.m.sc; i <= lookup.m.ec; i++) fullW += (widths[i] || 80);
                    for (let i = lookup.m.sr; i <= lookup.m.er; i++) fullH += (heights[i] || 25);
                    cw = fullW * zoom; ch = fullH * zoom;
                }

                // Фон ячейки
                let cellData = matrix[r] ? matrix[r][c] : null;
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(Math.floor(cx), Math.floor(cy), Math.ceil(cw), Math.ceil(ch));

                // Границы ячейки
                ctx.strokeStyle = "#e0e0e0";
                ctx.lineWidth = 1;
                ctx.strokeRect(Math.floor(cx) + 0.5, Math.floor(cy) + 0.5, Math.ceil(cw), Math.ceil(ch));

                // Текст ячейки
                let text = "";
                if (cellData !== null && cellData !== undefined) {
                    text = (typeof cellData === 'object') ? String(cellData.v ?? "") : String(cellData);
                }

                if (text !== "") {
                    ctx.save();
                    ctx.fillStyle = "#000000";
                    ctx.font = `${Math.max(9, Math.round(11 * zoom))}px Arial`;
                    ctx.beginPath();
                    ctx.rect(Math.max(ROW_NUM_WIDTH, cx), Math.max(COL_NUM_HEIGHT, cy), cw - 2, ch - 2);
                    ctx.clip();
                    ctx.fillText(text, cx + 4, cy + ch / 2);
                    ctx.restore();
                }
            }
        }

        // 2. Шапка колонок (A, B, C...)
        for (let c = visibleStartCol; c <= visibleEndCol; c++) {
            let rect = getCellRect(0, c);
            let cx = ROW_NUM_WIDTH + (rect.x - scrollX) * zoom;
            let cw = rect.w * zoom;
            let rx = Math.round(cx);
            let rw = Math.round(cx + cw) - rx;

            ctx.fillStyle = "#f8f9fa";
            ctx.fillRect(rx, 0, rw, COL_NUM_HEIGHT);
            ctx.strokeStyle = "#d0d0d0";
            ctx.strokeRect(rx + 0.5, 0.5, rw, COL_NUM_HEIGHT);

            ctx.fillStyle = "#555555";
            ctx.font = "bold 11px Arial";
            ctx.textAlign = "center";
            ctx.fillText(getColName(c), rx + rw / 2, COL_NUM_HEIGHT / 2);
        }

        // 3. Шапка строк (1, 2, 3...)
        ctx.textAlign = "center";
        for (let r = visibleStartRow; r <= visibleEndRow; r++) {
            let rect = getCellRect(r, 0);
            let cy = COL_NUM_HEIGHT + (rect.y - scrollY) * zoom;
            let ch = rect.h * zoom;
            let ry = Math.round(cy);
            let rh = Math.round(cy + ch) - ry;

            ctx.fillStyle = "#f8f9fa";
            ctx.fillRect(0, ry, ROW_NUM_WIDTH, rh);
            ctx.strokeStyle = "#d0d0d0";
            ctx.strokeRect(0.5, ry + 0.5, ROW_NUM_WIDTH, rh);

            ctx.fillStyle = "#555555";
            ctx.font = "bold 10px Arial";
            ctx.fillText(r + 1, ROW_NUM_WIDTH / 2, ry + rh / 2);
        }

        // Угловая залушка
        ctx.fillStyle = "#e9ecef";
        ctx.fillRect(0, 0, ROW_NUM_WIDTH, COL_NUM_HEIGHT);
        ctx.strokeStyle = "#c0c0c0";
        ctx.strokeRect(0.5, 0.5, ROW_NUM_WIDTH, COL_NUM_HEIGHT);

        ctx.restore();
    }

    function setupTouchEvents() {
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                lastScrollX = scrollX;
                lastScrollY = scrollY;
            } else if (e.touches.length === 2) {
                initialPinchDistance = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialZoom = zoom;
            }
        }, { passive: true });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && initialPinchDistance === null) {
                let dx = (touchStartX - e.touches[0].clientX) / zoom;
                let dy = (touchStartY - e.touches[0].clientY) / zoom;

                scrollX = Math.max(0, lastScrollX + dx);
                scrollY = Math.max(0, lastScrollY + dy);
                draw();
            } else if (e.touches.length === 2 && initialPinchDistance !== null) {
                let dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                let factor = dist / initialPinchDistance;
                zoom = Math.max(0.4, Math.min(initialZoom * factor, 2.5));
                draw();
            }
        }, { passive: true });

        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length < 2) {
                initialPinchDistance = null;
            }
        }, { passive: true });
    }

    window.onload = init;
</script>
</body>
</html>
