<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #e0e0e0; touch-action: none; }
        #container { position: relative; width: 100%; height: 100%; }
        #canvas { display: block; width: 100%; height: 100%; background: #fff; }
        #cellInput {
            position: absolute;
            display: none;
            border: 2px solid #1a73e8;
            outline: none;
            padding: 0 4px;
            font-family: Arial, sans-serif;
            background: #fff;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="canvas"></canvas>
        <input type="text" id="cellInput" />
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cellInput = document.getElementById('cellInput');

        const DEFAULT_COL_WIDTH = 80;
        const DEFAULT_ROW_HEIGHT = 24;
        const ROW_NUM_WIDTH = 40;
        const COL_NUM_HEIGHT = 24;

        let matrix = [];
        let merges = [];
        let widths = {};
        let heights = {};

        let zoom = 1.0;
        let scrollX = 0;
        let scrollY = 0;

        let maxCols = 30;
        let maxRows = 60;

        let selectedCell = null;
        let mergeLookup = {};

        // Для жестового управления (Touch)
        let lastTouchX = 0, lastTouchY = 0;
        let initialPinchDist = null;
        let initialZoom = 1.0;
        let isEditing = false;

        function initData(data) {
            if (!data) return;
            matrix = data.matrix || [];
            merges = data.merges || [];
            widths = data.widths || {};
            heights = data.heights || {};

            maxRows = Math.max(matrix.length, 50);
            maxCols = 30;
            matrix.forEach(row => {
                if (row && row.length > maxCols) maxCols = row.length;
            });

            buildMergeLookup();
            resizeCanvas();
            render();
        }

        function buildMergeLookup() {
            mergeLookup = {};
            merges.forEach(m => {
                const sr = m.sr !== undefined ? m.sr : m.startRow;
                const sc = m.sc !== undefined ? m.sc : m.startCol;
                const er = m.er !== undefined ? m.er : m.endRow;
                const ec = m.ec !== undefined ? m.ec : m.endCol;

                if (sr === undefined || sc === undefined || er === undefined || ec === undefined) return;
                const mergeObj = { sr, sc, er, ec };

                for (let r = sr; r <= er; r++) {
                    for (let c = sc; c <= ec; c++) {
                        const key = `${r}_${c}`;
                        if (r === sr && c === sc) {
                            mergeLookup[key] = { isMain: true, m: mergeObj };
                        } else {
                            mergeLookup[key] = { isChild: true, m: mergeObj, mainKey: `${sr}_${sc}` };
                        }
                    }
                }
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            render();
        });

        function getCellRect(r, c) {
            let x = 0;
            for (let i = 0; i < c; i++) x += (widths[i] || DEFAULT_COL_WIDTH);
            let y = 0;
            for (let i = 0; i < r; i++) y += (heights[i] || DEFAULT_ROW_HEIGHT);

            let w = widths[c] || DEFAULT_COL_WIDTH;
            let h = heights[r] || DEFAULT_ROW_HEIGHT;

            return { x, y, w, h };
        }

        function drawCustomBorder(x1, y1, x2, y2, borderStyle) {
            if (!borderStyle) return;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.strokeStyle = borderStyle.color || '#000000';
            ctx.lineWidth = (borderStyle.width || 1) * zoom;
            ctx.stroke();
        }

        function render() {
            const clientW = window.innerWidth;
            const clientH = window.innerHeight;

            ctx.clearRect(0, 0, clientW, clientH);

            // 1. СЕТКА
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;

            let curX = ROW_NUM_WIDTH - (scrollX * zoom);
            for (let c = 0; c < maxCols; c++) {
                let w = (widths[c] || DEFAULT_COL_WIDTH) * zoom;
                if (curX + w >= ROW_NUM_WIDTH && curX <= clientW) {
                    ctx.beginPath();
                    ctx.moveTo(curX + w, COL_NUM_HEIGHT);
                    ctx.lineTo(curX + w, clientH);
                    ctx.stroke();
                }
                curX += w;
            }

            let curY = COL_NUM_HEIGHT - (scrollY * zoom);
            for (let r = 0; r < maxRows; r++) {
                let h = (heights[r] || DEFAULT_ROW_HEIGHT) * zoom;
                if (curY + h >= COL_NUM_HEIGHT && cy <= clientH) {
                    ctx.beginPath();
                    ctx.moveTo(ROW_NUM_WIDTH, curY + h);
                    ctx.lineTo(clientW, curY + h);
                    ctx.stroke();
                }
                curY += h;
            }

            // 2. ФОН ЯЧЕЕК И РАМКИ
            for (let r = 0; r < maxRows; r++) {
                for (let c = 0; c < maxCols; c++) {
                    let lookup = mergeLookup[`${r}_${c}`];
                    if (lookup && lookup.isChild) continue;

                    let cellData = matrix[r] ? matrix[r][c] : null;
                    if (!cellData || typeof cellData !== 'object') continue;

                    let rect = getCellRect(r, c);
                    let cw = rect.w; let ch = rect.h;

                    if (lookup && lookup.isMain) {
                        cw = 0; ch = 0;
                        for (let i = lookup.m.sc; i <= lookup.m.ec; i++) cw += (widths[i] || DEFAULT_COL_WIDTH);
                        for (let i = lookup.m.sr; i <= lookup.m.er; i++) ch += (heights[i] || DEFAULT_ROW_HEIGHT);
                    }

                    let cx = ROW_NUM_WIDTH + (rect.x - scrollX) * zoom;
                    let cy = COL_NUM_HEIGHT + (rect.y - scrollY) * zoom;

                    if (cellData.bg) {
                        ctx.fillStyle = cellData.bg;
                        ctx.fillRect(cx, cy, cw * zoom, ch * zoom);
                    }

                    if (cellData.borders) {
                        let b = cellData.borders;
                        let ccw = cw * zoom; let cch = ch * zoom;
                        if (b.top) drawCustomBorder(cx, cy, cx + ccw, cy, b.top);
                        if (b.bottom) drawCustomBorder(cx, cy + cch, cx + ccw, cy + cch, b.bottom);
                        if (b.left) drawCustomBorder(cx, cy, cx, cy + cch, b.left);
                        if (b.right) drawCustomBorder(cx + ccw, cy, cx + ccw, cy + cch, b.right);
                    }
                }
            }

            // 3. ТЕКСТ ЯЧЕЕК (Без обрезания, если соседние ячейки пустые)
            for (let r = 0; r < maxRows; r++) {
                for (let c = 0; c < maxCols; c++) {
                    let lookup = mergeLookup[`${r}_${c}`];
                    if (lookup && lookup.isChild) continue;

                    let cellData = matrix[r] ? matrix[r][c] : null;
                    let text = "";
                    if (cellData !== null && cellData !== undefined) {
                        text = (typeof cellData === 'object') ? String(cellData.v ?? cellData.value ?? "") : String(cellData);
                    }
                    if (text === "") continue;

                    let rect = getCellRect(r, c);
                    let cx = ROW_NUM_WIDTH + (rect.x - scrollX) * zoom;
                    let cy = COL_NUM_HEIGHT + (rect.y - scrollY) * zoom;
                    let cw = rect.w * zoom;
                    let ch = rect.h * zoom;

                    if (lookup && lookup.isMain) {
                        let fullW = 0; let fullH = 0;
                        for (let i = lookup.m.sc; i <= lookup.m.ec; i++) fullW += (widths[i] || DEFAULT_COL_WIDTH);
                        for (let i = lookup.m.sr; i <= lookup.m.er; i++) fullH += (heights[i] || DEFAULT_ROW_HEIGHT);
                        cw = fullW * zoom; ch = fullH * zoom;
                    }

                    if (cx + cw < ROW_NUM_WIDTH || cy + ch < COL_NUM_HEIGHT || cx > clientW || cy > clientH) continue;

                    // Вычисляем доступное место под текст (протекание на соседние пустые ячейки)
                    let maxAvailableWidth = cw;
                    if (!lookup) {
                        for (let nextC = c + 1; nextC < maxCols; nextC++) {
                            let nextCell = matrix[r] ? matrix[r][nextC] : null;
                            let nextVal = (typeof nextCell === 'object' && nextCell) ? nextCell.v : nextCell;
                            if (!nextVal) {
                                maxAvailableWidth += (widths[nextC] || DEFAULT_COL_WIDTH) * zoom;
                            } else {
                                break;
                            }
                        }
                    }

                    ctx.save();
                    let textColor = (typeof cellData === 'object' && cellData !== null) ? (cellData.color || "#000000") : "#000000";
                    ctx.fillStyle = textColor;
                    ctx.font = `${Math.max(10, Math.round(12 * zoom))}px Arial`;
                    ctx.textBaseline = "middle";

                    ctx.beginPath();
                    let clipX = Math.max(ROW_NUM_WIDTH, cx);
                    let clipY = Math.max(COL_NUM_HEIGHT, cy);
                    let clipW = Math.min(clientW, cx + maxAvailableWidth) - clipX;
                    let clipH = Math.min(clientH, cy + ch) - clipY;

                    if (clipW > 0 && clipH > 0) {
                        ctx.rect(clipX, clipY, clipW, clipH);
                        ctx.clip();
                        ctx.fillText(text, cx + 4, cy + ch / 2);
                    }
                    ctx.restore();
                }
            }

            // 4. СИНЯЯ ОГРАНИЧИТЕЛЬНАЯ РАМКА ЛИСТА
            let totalSheetW = 0;
            for (let i = 0; i < maxCols; i++) totalSheetW += (widths[i] || DEFAULT_COL_WIDTH);
            let totalSheetH = 0;
            for (let i = 0; i < maxRows; i++) totalSheetH += (heights[i] || DEFAULT_ROW_HEIGHT);

            let boundX = ROW_NUM_WIDTH - (scrollX * zoom);
            let boundY = COL_NUM_HEIGHT - (scrollY * zoom);
            let boundW = totalSheetW * zoom;
            let boundH = totalSheetH * zoom;

            ctx.strokeStyle = '#1a73e8';
            ctx.lineWidth = 2;
            ctx.strokeRect(boundX, boundY, boundW, boundH);

            // 5. ВЫДЕЛЕНИЕ ЯЧЕЙКИ
            if (selectedCell) {
                let lookup = mergeLookup[`${selectedCell.r}_${selectedCell.c}`];
                let targetR = selectedCell.r;
                let targetC = selectedCell.c;

                if (lookup && lookup.isChild) {
                    targetR = lookup.m.sr;
                    targetC = lookup.m.sc;
                }

                let rect = getCellRect(targetR, targetC);
                let cw = rect.w; let ch = rect.h;

                let mainLookup = mergeLookup[`${targetR}_${targetC}`];
                if (mainLookup && mainLookup.isMain) {
                    cw = 0; ch = 0;
                    for (let i = mainLookup.m.sc; i <= mainLookup.m.ec; i++) cw += (widths[i] || DEFAULT_COL_WIDTH);
                    for (let i = mainLookup.m.sr; i <= mainLookup.m.er; i++) ch += (heights[i] || DEFAULT_ROW_HEIGHT);
                }

                let cx = ROW_NUM_WIDTH + (rect.x - scrollX) * zoom;
                let cy = COL_NUM_HEIGHT + (rect.y - scrollY) * zoom;

                ctx.strokeStyle = '#1a73e8';
                ctx.lineWidth = 2.5;
                ctx.strokeRect(cx, cy, cw * zoom, ch * zoom);
            }

            // 6. ШАПКИ СТРОК И КОЛОНОК
            ctx.fillStyle = '#f4f4f4';
            ctx.fillRect(0, 0, clientW, COL_NUM_HEIGHT);
            ctx.fillRect(0, 0, ROW_NUM_WIDTH, clientH);

            ctx.strokeStyle = '#cccccc';
            ctx.lineWidth = 1;
            ctx.strokeRect(0, 0, clientW, COL_NUM_HEIGHT);
            ctx.strokeRect(0, 0, ROW_NUM_WIDTH, clientH);

            ctx.fillStyle = '#444444';
            ctx.font = '11px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            let hX = ROW_NUM_WIDTH - (scrollX * zoom);
            for (let c = 0; c < maxCols; c++) {
                let w = (widths[c] || DEFAULT_COL_WIDTH) * zoom;
                if (hX + w >= ROW_NUM_WIDTH && hX <= clientW) {
                    ctx.fillText(getColName(c), hX + w / 2, COL_NUM_HEIGHT / 2);
                    ctx.beginPath(); ctx.moveTo(hX + w, 0); ctx.lineTo(hX + w, COL_NUM_HEIGHT); ctx.stroke();
                }
                hX += w;
            }

            let hY = COL_NUM_HEIGHT - (scrollY * zoom);
            for (let r = 0; r < maxRows; r++) {
                let h = (heights[r] || DEFAULT_ROW_HEIGHT) * zoom;
                if (hY + h >= COL_NUM_HEIGHT && hY <= clientH) {
                    ctx.fillText(String(r + 1), ROW_NUM_WIDTH / 2, hY + h / 2);
                    ctx.beginPath(); ctx.moveTo(0, hY + h); ctx.lineTo(ROW_NUM_WIDTH, hY + h); ctx.stroke();
                }
                hY += h;
            }

            ctx.fillStyle = '#e8e8e8';
            ctx.fillRect(0, 0, ROW_NUM_WIDTH, COL_NUM_HEIGHT);
            ctx.strokeRect(0, 0, ROW_NUM_WIDTH, COL_NUM_HEIGHT);
        }

        function getColName(n) {
            let name = "";
            while (n >= 0) {
                name = String.fromCharCode((n % 26) + 65) + name;
                n = Math.floor(n / 26) - 1;
            }
            return name;
        }

        // --- ОБРАБОТКА ТАЧ-ЖЕСТОВ (Сдвиг, Зум пальцами, Выделение) ---
        let tapTimer = null;
        let lastTapTime = 0;

        canvas.addEventListener('touchstart', (e) => {
            commitEditing();
            if (e.touches.length === 1) {
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;
            } else if (e.touches.length === 2) {
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialZoom = zoom;
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1) {
                let dx = e.touches[0].clientX - lastTouchX;
                let dy = e.touches[0].clientY - lastTouchY;
                lastTouchX = e.touches[0].clientX;
                lastTouchY = e.touches[0].clientY;

                scrollX = Math.max(0, scrollX - dx / zoom);
                scrollY = Math.max(0, scrollY - dy / zoom);
                render();
            } else if (e.touches.length === 2 && initialPinchDist) {
                let dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                zoom = Math.min(Math.max(0.4, initialZoom * (dist / initialPinchDist)), 2.5);
                render();
            }
        });

        canvas.addEventListener('touchend', (e) => {
            initialPinchDist = null;

            if (e.changedTouches.length === 1) {
                let touch = e.changedTouches[0];
                let currentTime = new Date().getTime();
                let tapLength = currentTime - lastTapTime;

                if (tapLength < 300 && tapLength > 0) {
                    // Двойное нажатие -> Редактирование
                    if (selectedCell) startEditing(selectedCell.r, selectedCell.c);
                } else {
                    // Одиночное нажатие -> Выбор ячейки
                    handleSelectCell(touch.clientX, touch.clientY);
                }
                lastTapTime = currentTime;
            }
        });

        function handleSelectCell(clientX, clientY) {
            const clickX = clientX - ROW_NUM_WIDTH;
            const clickY = clientY - COL_NUM_HEIGHT;
            if (clickX < 0 || clickY < 0) return;

            let targetC = -1;
            let currentX = -scrollX * zoom;
            for (let c = 0; c < maxCols; c++) {
                let w = (widths[c] || DEFAULT_COL_WIDTH) * zoom;
                if (clickX >= currentX && clickX < currentX + w) {
                    targetC = c;
                    break;
                }
                currentX += w;
            }

            let targetR = -1;
            let currentY = -scrollY * zoom;
            for (let r = 0; r < maxRows; r++) {
                let h = (heights[r] || DEFAULT_ROW_HEIGHT) * zoom;
                if (clickY >= currentY && clickY < currentY + h) {
                    targetR = r;
                    break;
                }
                currentY += h;
            }

            if (targetR !== -1 && targetC !== -1) {
                selectedCell = { r: targetR, c: targetC };
                render();
            }
        }

        function startEditing(r, c) {
            let rect = getCellRect(r, c);
            let cx = ROW_NUM_WIDTH + (rect.x - scrollX) * zoom;
            let cy = COL_NUM_HEIGHT + (rect.y - scrollY) * zoom;

            let cellData = matrix[r] ? matrix[r][c] : null;
            let val = "";
            if (cellData !== null && cellData !== undefined) {
                val = (typeof cellData === 'object') ? (cellData.v ?? cellData.value ?? "") : cellData;
            }

            cellInput.style.left = `${cx}px`;
            cellInput.style.top = `${cy}px`;
            cellInput.style.width = `${rect.w * zoom}px`;
            cellInput.style.height = `${rect.h * zoom}px`;
            cellInput.style.fontSize = `${12 * zoom}px`;
            cellInput.value = val;
            cellInput.style.display = 'block';
            cellInput.focus();
            isEditing = true;
        }

        function commitEditing() {
            if (!isEditing || !selectedCell) return;

            let r = selectedCell.r;
            let c = selectedCell.c;
            let newVal = cellInput.value;

            if (!matrix[r]) matrix[r] = [];

            if (typeof matrix[r][c] === 'object' && matrix[r][c] !== null) {
                matrix[r][c].v = newVal;
            } else {
                matrix[r][c] = { v: newVal };
            }

            cellInput.style.display = 'none';
            isEditing = false;
            render();
        }

        cellInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') commitEditing();
        });

        window.getCurrentDataJson = function() {
            commitEditing();
            return JSON.stringify({
                matrix: matrix,
                merges: merges,
                widths: widths,
                heights: heights
            });
        };

        window.loadJsonData = function(jsonStr) {
            try {
                const data = JSON.parse(jsonStr);
                initData(data);
            } catch (e) {
                console.error("Ошибка разбора JSON:", e);
            }
        };
    </script>
</body>
</html>
