<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Excel Grid</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
            overflow: auto;
        }
        table {
            border-collapse: collapse;
            table-layout: fixed;
            background-color: #ffffff;
        }
        td {
            border: 1px solid #d3d3d3;
            padding: 4px 8px;
            font-size: 14px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

    <div id="table-container"></div>

    <script>
        function requestDataFromAndroid() {
            try {
                if (window.AndroidBridge && typeof window.AndroidBridge.getExcelData === "function") {
                    const jsonString = window.AndroidBridge.getExcelData();
                    const data = JSON.parse(jsonString);
                    renderTable(data);
                } else {
                    console.warn("AndroidBridge недоступен");
                }
            } catch (e) {
                console.error("Ошибка при загрузке данных из Android:", e);
            }
        }

        function renderTable(data) {
            const container = document.getElementById("table-container");
            const matrix = data.matrix || [];
            const widths = data.widths || [];
            const heights = data.heights || [];

            let html = "<table>";

            // Рендерим колонки с шириной
            html += "<colgroup>";
            widths.forEach(w => {
                html += `<col style="width: ${w}px;">`;
            });
            html += "</colgroup>";

            // Рендерим строки и ячейки
            matrix.forEach((row, rIndex) => {
                const h = heights[rIndex] || 22;
                html += `<tr style="height: ${h}px;">`;
                row.forEach(cell => {
                    const val = cell && cell.v !== undefined ? cell.v : "";
                    html += `<td>${escapeHtml(val)}</td>`;
                });
                html += "</tr>";
            });

            html += "</table>";
            container.innerHTML = html;
        }

        function escapeHtml(text) {
            return String(text)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Автоматический запуск при загрузке страницы в WebView
        window.onload = function() {
            requestDataFromAndroid();
        };
    </script>
</body>
</html>
