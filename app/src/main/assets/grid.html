<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MiniExcel Grid</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            overflow: auto;
        }
        .grid-container {
            border-collapse: collapse;
            background-color: #fff;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 4px 6px;
            font-size: 13px;
            height: 28px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        th {
            background-color: #e6e6e6;
            color: #333;
            text-align: center;
            font-weight: bold;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .row-header {
            position: sticky;
            left: 0;
            background-color: #e6e6e6;
            z-index: 3;
            width: 40px;
            text-align: center;
        }
        th:first-child {
            z-index: 4;
        }
        td.editable {
            background-color: #fff;
        }
        td.editable:focus {
            outline: 2px solid #1a73e8;
            background-color: #e8f0fe !important;
        }
        .bt { border-top: 2px solid #000 !important; }
        .bb { border-bottom: 2px solid #000 !important; }
        .bl { border-left: 2px solid #000 !important; }
        .br { border-right: 2px solid #000 !important; }
    </style>
</head>
<body>

<table class="grid-container" id="excelTable">
    <thead id="tableHead"></thead>
    <tbody id="tableBody"></tbody>
</table>

<script>
    let originalData = {};
    let modifiedCells = {};

    function getColName(colIndex) {
        let name = '';
        while (colIndex >= 0) {
            name = String.fromCharCode((colIndex % 26) + 65) + name;
            colIndex = Math.floor(colIndex / 26) - 1;
        }
        return name;
    }

    window.loadJsonData = function(data) {
        originalData = data;
        modifiedCells = {};

        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');
        tableHead.innerHTML = '';
        tableBody.innerHTML = '';

        const maxRows = data.maxRows || 100;
        const maxCols = data.maxCols || 26;
        const colWidths = data.colWidths || {};
        const merged = data.merged || [];

        const mergedMap = {};
        const spanMap = {};

        merged.forEach(m => {
            for (let r = m.fromRow; r <= m.toRow; r++) {
                for (let c = m.fromCol; c <= m.toCol; c++) {
                    if (r === m.fromRow && c === m.fromCol) {
                        spanMap[`${r}_${c}`] = {
                            rowSpan: m.toRow - m.fromRow + 1,
                            colSpan: m.toCol - m.fromCol + 1
                        };
                    } else {
                        mergedMap[`${r}_${c}`] = true;
                    }
                }
            }
        });

        const cellMap = {};
        if (data.rows) {
            data.rows.forEach(row => {
                if (row.cells) {
                    row.cells.forEach(cell => {
                        cellMap[`${cell.r}_${cell.c}`] = cell;
                    });
                }
            });
        }

        const headRow = document.createElement('tr');
        const cornerTh = document.createElement('th');
        cornerTh.className = 'row-header';
        cornerTh.textContent = '';
        headRow.appendChild(cornerTh);

        for (let c = 0; c < maxCols; c++) {
            const th = document.createElement('th');
            th.textContent = getColName(c);
            if (colWidths[c]) {
                th.style.width = colWidths[c] + 'px';
            } else {
                th.style.width = '80px';
            }
            headRow.appendChild(th);
        }
        tableHead.appendChild(headRow);

        for (let r = 0; r < maxRows; r++) {
            const tr = document.createElement('tr');
            const rowTh = document.createElement('th');
            rowTh.className = 'row-header';
            rowTh.textContent = r + 1;
            tr.appendChild(rowTh);

            for (let c = 0; c < maxCols; c++) {
                const key = `${r}_${c}`;

                if (mergedMap[key]) {
                    continue;
                }

                const td = document.createElement('td');
                td.className = 'editable';
                td.contentEditable = "true";
                td.dataset.r = r;
                td.dataset.c = c;

                if (spanMap[key]) {
                    td.rowSpan = spanMap[key].rowSpan;
                    td.colSpan = spanMap[key].colSpan;
                }

                const cellData = cellMap[key];
                if (cellData) {
                    if (cellData.v !== undefined) {
                        td.textContent = cellData.v;
                    }
                    if (cellData.bg) {
                        td.style.backgroundColor = cellData.bg;
                    }
                    if (cellData.bt) td.classList.add('bt');
                    if (cellData.bb) td.classList.add('bb');
                    if (cellData.bl) td.classList.add('bl');
                    if (cellData.br) td.classList.add('br');
                }

                const trackChange = function() {
                    const row = td.dataset.r;
                    const col = td.dataset.c;
                    const val = td.textContent;
                    modifiedCells[`${row}_${col}`] = { r: parseInt(row), c: parseInt(col), v: val };
                };

                td.addEventListener('input', trackChange);
                td.addEventListener('keyup', trackChange);
                td.addEventListener('blur', trackChange);

                tr.appendChild(td);
            }
            tableBody.appendChild(tr);
        }
    };

    window.sendDiffsToKotlin = function() {
        const diffArray = Object.values(modifiedCells);
        if (window.AndroidBridge && window.AndroidBridge.saveChanges) {
            window.AndroidBridge.saveChanges(JSON.stringify(diffArray));
        }
    };
</script>
</body>
</html>
