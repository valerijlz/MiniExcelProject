<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #fff; }
        #canvas { display: block; width: 100%; height: 100%; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const DEFAULT_COL_WIDTH = 100;
        const DEFAULT_ROW_HEIGHT = 24;
        const ROW_NUM_WIDTH = 40;
        const COL_NUM_HEIGHT = 24;

        let matrix = [];
        let merges = [];
        let widths = {};
        let heights = {};

        let zoom = 1.0;
        let scrollX = 0;
        let scrollY = 0;

        let maxCols = 50;
        let maxRows = 100;

        let mergeLookup = {};

        function initData(data) {
            if (!data) return;
            matrix = data.matrix || [];
            merges = data.merges || [];
            widths = data.widths || {};
            heights = data.heights || {};

            buildMergeLookup();
            resizeCanvas();
            render();
        }

        function buildMergeLookup() {
            mergeLookup = {};
            merges.forEach(m => {
                const sr = m.sr !== undefined ? m.sr : m.startRow;
                const sc = m.sc !== undefined ? m.sc : m.startCol;
                const er = m.er !== undefined ? m.er : m.endRow;
                const ec = m.ec !== undefined ? m.ec : m.endCol;

                if (sr === undefined || sc === undefined || er === undefined || ec === undefined) return;

                const mergeObj = { sr, sc, er, ec };

                for (let r = sr; r <= er; r++) {
                    for (let c = sc; c <= ec; c++) {
                        const key = `${r}_${c}`;
                        if (r === sr && c === sc) {
                            mergeLookup[key] = { isMain: true, m: mergeObj };
                        } else {
                            mergeLookup[key] = { isChild: true, m: mergeObj, mainKey: `${sr}_${sc}` };
                        }
                    }
                }
            });
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            render();
        });

        function getCellRect(r, c) {
            let x = 0;
            for (let i = 0; i < c; i++) x += (widths[i] || DEFAULT_COL_WIDTH);
            let y = 0;
            for (let i = 0; i < r; i++) y += (heights[i] || DEFAULT_ROW_HEIGHT);

            let w = widths[c] || DEFAULT_COL_WIDTH;
            let h = heights[r] || DEFAULT_ROW_HEIGHT;

            return { x, y, w, h };
        }

        function drawCustomBorder(x1, y1, x2, y2, borderStyle) {
            if (!borderStyle) return;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);

            let style = borderStyle.style || borderStyle.borderStyle || 'thin';
            let color = borderStyle.color || '#000000';

            ctx.strokeStyle = color;

            if (style === 'dashed') {
                ctx.setLineDash([4, 4]);
                ctx.lineWidth = 1 * zoom;
            } else if (style === 'dotted') {
                ctx.setLineDash([2, 2]);
                ctx.lineWidth = 1 * zoom;
            } else if (style === 'thick' || style === 'medium') {
                ctx.setLineDash([]);
                ctx.lineWidth = 2 * zoom;
            } else {
                ctx.setLineDash([]);
                ctx.lineWidth = 1 * zoom;
            }

            ctx.stroke();
            ctx.setLineDash([]);
        }

        function render() {
            const clientW = window.innerWidth;
            const clientH = window.innerHeight;

            ctx.clearRect(0, 0, clientW, clientH);

            // 1. СЕТКА (ФОН)
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;

            let curX = ROW_NUM_WIDTH - (scrollX * zoom);
            for (let c = 0; c < maxCols; c++) {
                let w = (widths[c] || DEFAULT_COL_WIDTH) * zoom;
                if (curX + w >= ROW_NUM_WIDTH && curX <= clientW) {
                    ctx.beginPath();
                    ctx.moveTo(curX + w, COL_NUM_HEIGHT);
                    ctx.lineTo(curX + w, clientH);
                    ctx.stroke();
                }
                curX += w;
            }

            let curY = COL_NUM_HEIGHT - (scrollY * zoom);
            for (let r = 0; r < maxRows; r++) {
                let h = (heights[r] || DEFAULT_ROW_HEIGHT) * zoom;
                if (curY + h >= COL_NUM_HEIGHT && curY <= clientH) {
                    ctx.beginPath();
                    ctx.moveTo(ROW_NUM_WIDTH, curY + h);
                    ctx.lineTo(clientW, curY + h);
                    ctx.stroke();
                }
                curY += h;
            }

            // 2. ФОН ОБЪЕДИНЕННЫХ И ОБЫЧНЫХ ЯЧЕЕК
            for (let r = 0; r < maxRows; r++) {
                for (let c = 0; c < maxCols; c++) {
                    let lookup = mergeLookup[`${r}_${c}`];
                    if (lookup && lookup.isChild) continue;

                    let cellData = matrix[r] ? matrix[r][c] : null;
                    let bgColor = (typeof cellData === 'object' && cellData !== null) ? cellData.bg : null;

                    if (!bgColor) continue;

                    let rect = getCellRect(r, c);
                    let cw = rect.w;
                    let ch = rect.h;

                    if (lookup && lookup.isMain) {
                        cw = 0; ch = 0;
                        for (let i = lookup.m.sc; i <= lookup.m.ec; i++) cw += (widths[i] || DEFAULT_COL_WIDTH);
                        for (let i = lookup.m.sr; i <= lookup.m.er; i++) ch += (heights[i] || DEFAULT_ROW_HEIGHT);
                    }

                    let cx = ROW_NUM_WIDTH + (rect.x - scrollX) * zoom;
                    let cy = COL_NUM_HEIGHT + (rect.y - scrollY) * zoom;

                    ctx.fillStyle = bgColor;
                    ctx.fillRect(cx, cy, cw * zoom, ch * zoom);
                }
            }

            // 2.1 ИНДИВИДУАЛЬНЫЕ РАМКИ ЯЧЕЕК (BORDERS)
            ctx.save();
            for (let r = 0; r < maxRows; r++) {
                for (let c = 0; c < maxCols; c++) {
                    let lookup = mergeLookup[`${r}_${c}`];
                    // Пропускаем дочерние ячейки объединенной области
                    if (lookup && lookup.isChild) continue;

                    let cellData = matrix[r] ? matrix[r][c] : null;
                    if (!cellData || typeof cellData !== 'object' || !cellData.borders) continue;

                    let rect = getCellRect(r, c);
                    let cw = rect.w;
                    let ch = rect.h;

                    // Если это главная ячейка объединения, вычисляем внешние габариты
                    if (lookup && lookup.isMain) {
                        cw = 0; ch = 0;
                        for (let i = lookup.m.sc; i <= lookup.m.ec; i++) cw += (widths[i] || DEFAULT_COL_WIDTH);
                        for (let i = lookup.m.sr; i <= lookup.m.er; i++) ch += (heights[i] || DEFAULT_ROW_HEIGHT);
                    }

                    let cx = ROW_NUM_WIDTH + (rect.x - scrollX) * zoom;
                    let cy = COL_NUM_HEIGHT + (rect.y - scrollY) * zoom;
                    let ccw = cw * zoom;
                    let cch = ch * zoom;

                    let b = cellData.borders;
                    if (b.top) drawCustomBorder(cx, cy, cx + ccw, cy, b.top);
                    if (b.bottom) drawCustomBorder(cx, cy + cch, cx + ccw, cy + cch, b.bottom);
                    if (b.left) drawCustomBorder(cx, cy, cx, cy + cch, b.left);
                    if (b.right) drawCustomBorder(cx + ccw, cy, cx + ccw, cy + cch, b.right);
                }
            }
            ctx.restore();

            // 3. ТЕКСТ ЯЧЕЕК
            for (let r = 0; r < maxRows; r++) {
                for (let c = 0; c < maxCols; c++) {
                    let lookup = mergeLookup[`${r}_${c}`];
                    if (lookup && lookup.isChild) continue;

                    let cellData = matrix[r] ? matrix[r][c] : null;
                    let text = "";
                    if (cellData !== null && cellData !== undefined) {
                        text = (typeof cellData === 'object') ? String(cellData.v ?? cellData.value ?? "") : String(cellData);
                    }
                    if (text === "") continue;

                    let rect = getCellRect(r, c);
                    let cx = ROW_NUM_WIDTH + (rect.x - scrollX) * zoom;
                    let cy = COL_NUM_HEIGHT + (rect.y - scrollY) * zoom;
                    let cw = rect.w * zoom;
                    let ch = rect.h * zoom;

                    if (lookup && lookup.isMain) {
                        let fullW = 0; let fullH = 0;
                        for (let i = lookup.m.sc; i <= lookup.m.ec; i++) fullW += (widths[i] || DEFAULT_COL_WIDTH);
                        for (let i = lookup.m.sr; i <= lookup.m.er; i++) fullH += (heights[i] || DEFAULT_ROW_HEIGHT);
                        cw = fullW * zoom;
                        ch = fullH * zoom;
                    }

                    if (cx + cw < ROW_NUM_WIDTH || cy + ch < COL_NUM_HEIGHT || cx > clientW || cy > clientH) continue;

                    ctx.save();
                    let textColor = (typeof cellData === 'object' && cellData !== null) ? (cellData.color || cellData.textColor || "#000000") : "#000000";
                    ctx.fillStyle = textColor;
                    ctx.font = `${Math.max(9, Math.round(11 * zoom))}px Arial`;
                    ctx.textBaseline = "middle";

                    // Строгая обрезка текста по габаритам ячейки (одиночной или объединенной)
                    ctx.beginPath();
                    let clipX = Math.max(ROW_NUM_WIDTH, cx);
                    let clipY = Math.max(COL_NUM_HEIGHT, cy);
                    let clipW = Math.min(clientW, cx + cw) - clipX;
                    let clipH = Math.min(clientH, cy + ch) - clipY;

                    if (clipW > 0 && clipH > 0) {
                        ctx.rect(clipX, clipY, clipW, clipH);
                        ctx.clip();
                        ctx.fillText(text, cx + 5, cy + ch / 2);
                    }
                    ctx.restore();
                }
            }

            // 4. ЗАГОЛОВКИ КОЛОНОК И СТРОК
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, clientW, COL_NUM_HEIGHT);
            ctx.fillRect(0, 0, ROW_NUM_WIDTH, clientH);

            ctx.strokeStyle = '#b0b0b0';
            ctx.strokeRect(0, 0, clientW, COL_NUM_HEIGHT);
            ctx.strokeRect(0, 0, ROW_NUM_WIDTH, clientH);

            ctx.fillStyle = '#333333';
            ctx.font = '12px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Буквы колонок (A, B, C...)
            let hX = ROW_NUM_WIDTH - (scrollX * zoom);
            for (let c = 0; c < maxCols; c++) {
                let w = (widths[c] || DEFAULT_COL_WIDTH) * zoom;
                if (hX + w >= ROW_NUM_WIDTH && hX <= clientW) {
                    let label = getColName(c);
                    ctx.fillText(label, hX + w / 2, COL_NUM_HEIGHT / 2);
                    ctx.beginPath();
                    ctx.moveTo(hX + w, 0);
                    ctx.lineTo(hX + w, COL_NUM_HEIGHT);
                    ctx.stroke();
                }
                hX += w;
            }

            // Номера строк (1, 2, 3...)
            let hY = COL_NUM_HEIGHT - (scrollY * zoom);
            for (let r = 0; r < maxRows; r++) {
                let h = (heights[r] || DEFAULT_ROW_HEIGHT) * zoom;
                if (hY + h >= COL_NUM_HEIGHT && hY <= clientH) {
                    ctx.fillText(String(r + 1), ROW_NUM_WIDTH / 2, hY + h / 2);
                    ctx.beginPath();
                    ctx.moveTo(0, hY + h);
                    ctx.lineTo(ROW_NUM_WIDTH, hY + h);
                    ctx.stroke();
                }
                hY += h;
            }

            // Левый верхний угол
            ctx.fillStyle = '#e0e0e0';
            ctx.fillRect(0, 0, ROW_NUM_WIDTH, COL_NUM_HEIGHT);
            ctx.strokeRect(0, 0, ROW_NUM_WIDTH, COL_NUM_HEIGHT);
        }

        function getColName(n) {
            let name = "";
            while (n >= 0) {
                name = String.fromCharCode((n % 26) + 65) + name;
                n = Math.floor(n / 26) - 1;
            }
            return name;
        }

        window.loadJsonData = function(jsonStr) {
            try {
                const data = JSON.parse(jsonStr);
                initData(data);
            } catch (e) {
                console.error("Ошибка разбора JSON:", e);
            }
        };
    </script>
</body>
</html>
