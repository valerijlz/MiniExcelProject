<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>MiniExcel Grid</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #f0f0f0; }
        #canvasContainer { position: relative; width: 100vw; height: 100vh; }
        canvas { display: block; width: 100%; height: 100%; }
        #cellInput {
            position: absolute;
            display: none;
            border: 2px solid #1a73e8;
            outline: none;
            padding: 0 4px;
            font-family: sans-serif;
            font-size: 14px;
            background: #fff;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="canvasContainer">
    <canvas id="gridCanvas"></canvas>
    <input type="text" id="cellInput" />
</div>

<script>
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const cellInput = document.getElementById('cellInput');

    // Размеры сетки
    const DEFAULT_COL_WIDTH = 80;
    const DEFAULT_ROW_HEIGHT = 24;
    const HEADER_WIDTH = 40;
    const HEADER_HEIGHT = 24;

    let gridData = {}; // Map: `${r}_${c}` -> { v: string, bg: string }
    let diffs = {};    // Map: `${r}_${c}` -> string (новые значения)

    let scale = window.devicePixelRatio || 1;
    let zoom = 1.0;
    let scrollX = 0;
    let scrollY = 0;

    let selectedCell = null; // { r, c }
    let maxRows = 100;
    let maxCols = 26;

    function initCanvas() {
        canvas.width = window.innerWidth * scale;
        canvas.height = window.innerHeight * scale;
        render();
    }

    window.addEventListener('resize', initCanvas);

    // Прием JSON из Kotlin
    window.loadJsonData = function(data) {
        gridData = {};
        diffs = {};
        maxRows = data.maxRows || 100;
        maxCols = data.maxCols || 26;

        if (data.rows) {
            data.rows.forEach(row => {
                row.cells.forEach(cell => {
                    gridData[`${cell.r}_${cell.c}`] = {
                        v: cell.v || "",
                        bg: cell.bg || null
                    };
                });
            });
        }
        render();
    };

    // Отрисовка сетки и текста с поддержкой Overflow
    function render() {
        ctx.save();
        ctx.scale(scale, scale);
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

        ctx.font = `${13 * zoom}px sans-serif`;
        ctx.textBaseline = 'middle';

        // 1. Отрисовка ячеек
        for (let r = 0; r < maxRows; r++) {
            let y = HEADER_HEIGHT + r * DEFAULT_ROW_HEIGHT * zoom - scrollY;
            if (y + DEFAULT_ROW_HEIGHT * zoom < HEADER_HEIGHT || y > window.innerHeight) continue;

            for (let c = 0; c < maxCols; c++) {
                let x = HEADER_WIDTH + c * DEFAULT_COL_WIDTH * zoom - scrollX;
                if (x + DEFAULT_COL_WIDTH * zoom < HEADER_WIDTH || x > window.innerWidth) continue;

                let key = `${r}_${c}`;
                let cellData = gridData[key] || {};
                let cellVal = diffs[key] !== undefined ? diffs[key] : (cellData.v || "");

                // Фон
                if (cellData.bg) {
                    ctx.fillStyle = cellData.bg;
                    ctx.fillRect(x, y, DEFAULT_COL_WIDTH * zoom, DEFAULT_ROW_HEIGHT * zoom);
                }

                // Сетка
                ctx.strokeStyle = '#d0d0d0';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(x, y, DEFAULT_COL_WIDTH * zoom, DEFAULT_ROW_HEIGHT * zoom);

                // Отрисовка Overflow Текста
                if (cellVal) {
                    ctx.fillStyle = '#000000';
                    let textWidth = ctx.measureText(cellVal).width;
                    let cellWidth = DEFAULT_COL_WIDTH * zoom;

                    // Если текст шире ячейки — проверяем пустые ячейки справа
                    let allowedWidth = cellWidth;
                    if (textWidth > cellWidth - 8) {
                        let nextC = c + 1;
                        while (nextC < maxCols) {
                            let nextKey = `${r}_${nextC}`;
                            let nextCell = gridData[nextKey];
                            let nextVal = diffs[nextKey] !== undefined ? diffs[nextKey] : (nextCell ? nextCell.v : "");
                            if (!nextVal && (!nextCell || !nextCell.bg)) {
                                allowedWidth += DEFAULT_COL_WIDTH * zoom;
                                nextC++;
                            } else {
                                break;
                            }
                        }
                    }

                    ctx.save();
                    ctx.beginPath();
                    ctx.rect(x + 2, y, allowedWidth - 4, DEFAULT_ROW_HEIGHT * zoom);
                    ctx.clip();
                    ctx.fillText(cellVal, x + 4, y + (DEFAULT_ROW_HEIGHT * zoom) / 2);
                    ctx.restore();
                }
            }
        }

        // 2. Рамка выделенной ячейки
        if (selectedCell) {
            let sx = HEADER_WIDTH + selectedCell.c * DEFAULT_COL_WIDTH * zoom - scrollX;
            let sy = HEADER_HEIGHT + selectedCell.r * DEFAULT_ROW_HEIGHT * zoom - scrollY;
            ctx.strokeStyle = '#1a73e8';
            ctx.lineWidth = 2;
            ctx.strokeRect(sx, sy, DEFAULT_COL_WIDTH * zoom, DEFAULT_ROW_HEIGHT * zoom);
        }

        // 3. Заголовки (A, B, C... / 1, 2, 3...)
        renderHeaders();

        ctx.restore();
    }

    function renderHeaders() {
        ctx.fillStyle = '#f8f9fa';
        ctx.fillRect(0, 0, window.innerWidth, HEADER_HEIGHT);
        ctx.fillRect(0, 0, HEADER_WIDTH, window.innerHeight);

        ctx.fillStyle = '#5f6368';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#c0c0c0';

        // Колонки
        for (let c = 0; c < maxCols; c++) {
            let x = HEADER_WIDTH + c * DEFAULT_COL_WIDTH * zoom - scrollX;
            if (x < HEADER_WIDTH || x > window.innerWidth) continue;
            ctx.strokeRect(x, 0, DEFAULT_COL_WIDTH * zoom, HEADER_HEIGHT);
            ctx.fillText(String.fromCharCode(65 + c), x + (DEFAULT_COL_WIDTH * zoom) / 2, HEADER_HEIGHT / 2);
        }

        // Строки
        for (let r = 0; r < maxRows; r++) {
            let y = HEADER_HEIGHT + r * DEFAULT_ROW_HEIGHT * zoom - scrollY;
            if (y < HEADER_HEIGHT || y > window.innerHeight) continue;
            ctx.strokeRect(0, y, HEADER_WIDTH, DEFAULT_ROW_HEIGHT * zoom);
            ctx.fillText(r + 1, HEADER_WIDTH / 2, y + (DEFAULT_ROW_HEIGHT * zoom) / 2);
        }

        // Левый верхний угол
        ctx.fillStyle = '#e8eaed';
        ctx.fillRect(0, 0, HEADER_WIDTH, HEADER_HEIGHT);
        ctx.strokeRect(0, 0, HEADER_WIDTH, HEADER_HEIGHT);
    }

    // Touch Event Handling (Без задержки 300ms для Pinch-Zoom & Scroll)
    let lastTouches = [];
    let touchStartTime = 0;
    let lastTapTime = 0;

    canvas.addEventListener('touchstart', (e) => {
        lastTouches = Array.from(e.touches);
        touchStartTime = Date.now();
        if (e.touches.length === 1 && cellInput.style.display === 'block') {
            closeEditor(true);
        }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && lastTouches.length === 1) {
            // Скролл
            let dx = lastTouches[0].clientX - e.touches[0].clientX;
            let dy = lastTouches[0].clientY - e.touches[0].clientY;
            scrollX = Math.max(0, scrollX + dx);
            scrollY = Math.max(0, scrollY + dy);
            render();
        } else if (e.touches.length === 2 && lastTouches.length === 2) {
            // Pinch-to-zoom
            let prevDist = Math.hypot(
                lastTouches[0].clientX - lastTouches[1].clientX,
                lastTouches[0].clientY - lastTouches[1].clientY
            );
            let currDist = Math.hypot(
                e.touches[0].clientX - e.touches[1].clientX,
                e.touches[0].clientY - e.touches[1].clientY
            );
            let factor = currDist / prevDist;
            zoom = Math.min(Math.max(0.5, zoom * factor), 2.5);
            render();
        }
        lastTouches = Array.from(e.touches);
    }, { passive: true });

    canvas.addEventListener('touchend', (e) => {
        let touchDuration = Date.now() - touchStartTime;
        if (touchDuration < 200 && lastTouches.length === 1) {
            let touch = lastTouches[0];
            let x = touch.clientX - HEADER_WIDTH + scrollX;
            let y = touch.clientY - HEADER_HEIGHT + scrollY;

            if (x > 0 && y > 0) {
                let col = Math.floor(x / (DEFAULT_COL_WIDTH * zoom));
                let row = Math.floor(y / (DEFAULT_ROW_HEIGHT * zoom));

                if (col < maxCols && row < maxRows) {
                    let now = Date.now();
                    if (now - lastTapTime < 300 && selectedCell && selectedCell.r === row && selectedCell.c === col) {
                        // Двойной тап -> Редактирование
                        openEditor(row, col);
                    } else {
                        // Одиночный тап -> Выделение
                        selectedCell = { r: row, c: col };
                        render();
                    }
                    lastTapTime = now;
                }
            }
        }
    });

    // Редактор ячеек
    function openEditor(r, c) {
        selectedCell = { r, c };
        let key = `${r}_${c}`;
        let currentVal = diffs[key] !== undefined ? diffs[key] : (gridData[key] ? gridData[key].v : "");

        let x = HEADER_WIDTH + c * DEFAULT_COL_WIDTH * zoom - scrollX;
        let y = HEADER_HEIGHT + r * DEFAULT_ROW_HEIGHT * zoom - scrollY;

        cellInput.style.left = `${x}px`;
        cellInput.style.top = `${y}px`;
        cellInput.style.width = `${DEFAULT_COL_WIDTH * zoom}px`;
        cellInput.style.height = `${DEFAULT_ROW_HEIGHT * zoom}px`;
        cellInput.value = currentVal;
        cellInput.style.display = 'block';
        cellInput.focus();
    }

    function closeEditor(save) {
        if (cellInput.style.display === 'none') return;
        if (save && selectedCell) {
            let key = `${selectedCell.r}_${selectedCell.c}`;
            diffs[key] = cellInput.value;

            // Вызов автосохранения через мост AndroidBridge
            sendDiffsToKotlin();
        }
        cellInput.style.display = 'none';
        render();
    }

    cellInput.addEventListener('blur', () => closeEditor(true));
    cellInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') closeEditor(true);
        if (e.key === 'Escape') closeEditor(false);
    });

    function sendDiffsToKotlin() {
        if (window.AndroidBridge && typeof window.AndroidBridge.saveChanges === 'function') {
            let diffArray = [];
            for (let key in diffs) {
                let parts = key.split('_');
                diffArray.push({
                    r: parseInt(parts[0]),
                    c: parseInt(parts[1]),
                    v: diffs[key]
                });
            }
            window.AndroidBridge.saveChanges(JSON.stringify(diffArray));
        }
    }

    initCanvas();
</script>
</body>
</html>
