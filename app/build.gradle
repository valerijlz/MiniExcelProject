plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.miniexcel'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.miniexcel"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/groovy-*'
            ]
            // Позволяет правильным ServiceLoader файлам попасть в сборку без конфликтов
            pickFirsts += [
                'META-INF/services/javax.xml.stream.XMLInputFactory',
                'META-INF/services/javax.xml.stream.XMLOutputFactory',
                'META-INF/services/javax.xml.stream.XMLEventFactory'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'

    // Полноценный StAX-парсер для Android (убирает com.bea.xml.stream)
    implementation 'com.fasterxml:aalto-xml:1.3.2'

    // POI Android для поддержки XLS и XLSX
    implementation 'com.github.SUPERCILEX.poi-android:poi:3.17'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
}
